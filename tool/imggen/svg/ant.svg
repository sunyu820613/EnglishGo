<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="45%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#EFE8D2"/>
      <stop offset="100%" stop-color="#F8F1E6"/>
    </radialGradient>
    <radialGradient id="seg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#B96A52"/>
      <stop offset="60%" stop-color="#9C4F3C"/>
      <stop offset="100%" stop-color="#7E3B2C"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <circle cx="240" cy="200" r="10" fill="#EAD9BE"/>
  <circle cx="820" cy="260" r="7" fill="#EAD9BE"/>
  <circle cx="180" cy="760" r="8" fill="#EAD9BE"/>
  <circle cx="850" cy="740" r="11" fill="#EAD9BE"/>

  <ellipse cx="512" cy="836" rx="300" ry="44" fill="#D9C4A4" opacity="0.55"/>

  <!-- legs (behind body) -->
  <g stroke="#4A3A30" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M420 640 C 396 700, 360 750, 320 790"/>
    <path d="M500 660 C 496 716, 486 762, 470 800"/>
    <path d="M580 650 C 600 706, 626 756, 662 794"/>
    <path d="M410 610 C 350 640, 300 660, 250 668"/>
    <path d="M600 610 C 660 646, 712 668, 764 680"/>
  </g>

  <!-- antennae -->
  <g stroke="#4A3A30" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M300 388 C 258 330, 240 280, 258 224"/>
    <path d="M400 360 C 392 300, 404 250, 444 214"/>
  </g>
  <circle cx="258" cy="216" r="22" fill="#9C4F3C" stroke="#4A3A30" stroke-width="10"/>
  <circle cx="448" cy="206" r="22" fill="#9C4F3C" stroke="#4A3A30" stroke-width="10"/>

  <!-- abdomen -->
  <ellipse cx="700" cy="560" rx="180" ry="150" fill="url(#seg)" stroke="#4A3A30" stroke-width="12"/>
  <!-- thorax -->
  <ellipse cx="500" cy="560" rx="110" ry="98" fill="url(#seg)" stroke="#4A3A30" stroke-width="12"/>
  <!-- head -->
  <circle cx="340" cy="500" r="118" fill="url(#seg)" stroke="#4A3A30" stroke-width="12"/>

  <!-- face -->
  <circle cx="308" cy="480" r="34" fill="#FFFFFF"/>
  <circle cx="318" cy="486" r="16" fill="#332621"/>
  <circle cx="372" cy="478" r="30" fill="#FFFFFF"/>
  <circle cx="380" cy="484" r="14" fill="#332621"/>
  <path d="M320 560 C 340 580, 372 580, 390 562" fill="none" stroke="#332621" stroke-width="12" stroke-linecap="round"/>
  <ellipse cx="272" cy="548" rx="26" ry="18" fill="#E58B70" opacity="0.6"/>

  <!-- highlights -->
  <ellipse cx="640" cy="480" rx="60" ry="42" fill="#FFFFFF" opacity="0.3" transform="rotate(-20 640 480)"/>
  <ellipse cx="470" cy="510" rx="34" ry="24" fill="#FFFFFF" opacity="0.3" transform="rotate(-20 470 510)"/>
  <ellipse cx="306" cy="420" rx="34" ry="22" fill="#FFFFFF" opacity="0.3" transform="rotate(-15 306 420)"/>
</svg>
