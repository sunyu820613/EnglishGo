  <!-- muzzle -->
  <ellipse cx="512" cy="446" rx="128" ry="96" fill="#EFD9BE" stroke="#4A3A30" stroke-width="10"/>
  <ellipse cx="512" cy="404" rx="40" ry="30" fill="#4A3A30"/>
  <path d="M512 434 L 512 470" stroke="#4A3A30" stroke-width="10" stroke-linecap="round"/>
  <path d="M462 486 C 480 506, 544 506, 562 486" fill="none" stroke="#4A3A30" stroke-width="12" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="404" cy="360" r="22" fill="#332621"/>
  <circle cx="620" cy="360" r="22" fill="#332621"/>
  <circle cx="412" cy="352" r="7" fill="#FFFFFF"/>
  <circle cx="628" cy="352" r="7" fill="#FFFFFF"/>

  <!-- blush -->
  <ellipse cx="342" cy="440" rx="34" ry="22" fill="#E5A583" opacity="0.7"/>
  <ellipse cx="682" cy="440" rx="34" ry="22" fill="#E5A583" opacity="0.7"/>

  <!-- highlight -->
  <ellipse cx="390" cy="260" rx="70" ry="46" fill="#FFFFFF" opacity="0.25" transform="rotate(-18 390 260)"/>
</svg>
