  <ellipse cx="512" cy="740" rx="130" ry="118" fill="#EFD9BE"/>

  <!-- arms -->
  <path d="M330 610 C 250 640, 220 700, 236 760 C 300 770, 356 740, 386 690" fill="url(#fur)" stroke="#4A3A30" stroke-width="12" stroke-linejoin="round"/>
  <path d="M694 610 C 774 640, 804 700, 788 760 C 724 770, 668 740, 638 690" fill="url(#fur)" stroke="#4A3A30" stroke-width="12" stroke-linejoin="round"/>

  <!-- head -->
  <path d="M282 380 C 282 250, 380 178, 512 178 C 644 178, 742 250, 742 380 C 742 500, 644 566, 512 566 C 380 566, 282 500, 282 380 Z"
