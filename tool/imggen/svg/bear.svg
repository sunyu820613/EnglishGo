<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="45%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#F2E4CC"/>
      <stop offset="100%" stop-color="#F8F1E6"/>
    </radialGradient>
    <radialGradient id="fur" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#C08A5F"/>
      <stop offset="60%" stop-color="#A9744F"/>
      <stop offset="100%" stop-color="#8A5A3B"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <circle cx="240" cy="200" r="10" fill="#EAD9BE"/>
  <circle cx="820" cy="260" r="7" fill="#EAD9BE"/>
  <circle cx="180" cy="760" r="8" fill="#EAD9BE"/>
  <circle cx="850" cy="740" r="11" fill="#EAD9BE"/>

  <ellipse cx="512" cy="880" rx="300" ry="44" fill="#D9C4A4" opacity="0.55"/>

  <!-- ears -->
  <circle cx="330" cy="270" r="96" fill="url(#fur)" stroke="#4A3A30" stroke-width="12"/>
  <circle cx="694" cy="270" r="96" fill="url(#fur)" stroke="#4A3A30" stroke-width="12"/>
  <circle cx="330" cy="278" r="46" fill="#EFD9BE"/>
  <circle cx="694" cy="278" r="46" fill="#EFD9BE"/>

  <!-- body -->
  <path d="M310 640 C 300 800, 380 890, 512 890 C 644 890, 724 800, 714 640 C 706 560, 640 520, 512 520 C 384 520, 318 560, 310 640 Z"
