<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgGlow" cx="45%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#F3E6D6"/>
      <stop offset="100%" stop-color="#F8F1E6"/>
    </radialGradient>
    <radialGradient id="fur" cx="36%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#F2B15C"/>
      <stop offset="60%" stop-color="#E8973E"/>
      <stop offset="100%" stop-color="#CE7A2B"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgGlow)"/>
  <circle cx="240" cy="200" r="10" fill="#EAD9BE"/>
  <circle cx="820" cy="260" r="7" fill="#EAD9BE"/>
  <circle cx="180" cy="760" r="8" fill="#EAD9BE"/>
  <circle cx="850" cy="740" r="11" fill="#EAD9BE"/>

  <ellipse cx="512" cy="864" rx="290" ry="42" fill="#D9C4A4" opacity="0.55"/>

  <!-- tail -->
  <path d="M700 700 C 800 700, 840 600, 800 520 C 780 560, 760 610, 700 640 Z"
        fill="url(#fur)" stroke="#4A3A30" stroke-width="12" stroke-linejoin="round"/>

  <!-- body -->
  <ellipse cx="512" cy="760" rx="200" ry="140" fill="url(#fur)" stroke="#4A3A30" stroke-width="12"/>
  <ellipse cx="512" cy="800" rx="110" ry="90" fill="#FBEBD4"/>

  <!-- ears -->
  <path d="M356 330 L 320 210 L 440 300 Z" fill="url(#fur)" stroke="#4A3A30" stroke-width="12" stroke-linejoin="round"/>
  <path d="M668 330 L 704 210 L 584 300 Z" fill="url(#fur)" stroke="#4A3A30" stroke-width="12" stroke-linejoin="round"/>
  <path d="M362 314 L 344 240 L 410 292 Z" fill="#F6C9A0"/>
  <path d="M662 314 L 680 240 L 614 292 Z" fill="#F6C9A0"/>

  <!-- head -->
  <circle cx="512" cy="460" r="188" fill="url(#fur)" stroke="#4A3A30" stroke-width="12"/>

  <!-- stripes -->
  <path d="M420 320 L 400 280" stroke="#B9631E" stroke-width="14" stroke-linecap="round"/>
  <path d="M604 320 L 624 280" stroke="#B9631E" stroke-width="14" stroke-linecap="round"/>
  <path d="M360 440 L 320 424" stroke="#B9631E" stroke-width="14" stroke-linecap="round"/>
  <path d="M664 440 L 704 424" stroke="#B9631E" stroke-width="14" stroke-linecap="round"/>

  <!-- muzzle -->
  <ellipse cx="512" cy="512" rx="90" ry="60" fill="#FBEBD4"/>

  <!-- eyes -->
  <ellipse cx="440" cy="440" rx="26" ry="32" fill="#4A3A30"/>
  <ellipse cx="584" cy="440" rx="26" ry="32" fill="#4A3A30"/>
  <circle cx="448" cy="428" r="8" fill="#FFFFFF"/>
  <circle cx="592" cy="428" r="8" fill="#FFFFFF"/>

  <!-- nose + mouth -->
  <path d="M494 500 L 530 500 L 512 520 Z" fill="#B9631E"/>
  <path d="M512 520 L 512 540" stroke="#4A3A30" stroke-width="8" stroke-linecap="round"/>
  <path d="M460 556 C 480 574, 500 574, 512 556" fill="none" stroke="#4A3A30" stroke-width="10" stroke-linecap="round"/>
  <path d="M564 556 C 544 574, 524 574, 512 556" fill="none" stroke="#4A3A30" stroke-width="10" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#4A3A30" stroke-width="6" stroke-linecap="round">
    <path d="M330 500 L 430 512"/>
    <path d="M330 540 L 430 536"/>
    <path d="M694 500 L 594 512"/>
    <path d="M694 540 L 594 536"/>
  </g>

  <!-- blush -->
  <ellipse cx="386" cy="500" rx="26" ry="16" fill="#F0906C" opacity="0.55"/>
  <ellipse cx="638" cy="500" rx="26" ry="16" fill="#F0906C" opacity="0.55"/>

  <!-- paws -->
  <ellipse cx="420" cy="874" rx="46" ry="30" fill="url(#fur)" stroke="#4A3A30" stroke-width="10"/>
  <ellipse cx="604" cy="874" rx="46" ry="30" fill="url(#fur)" stroke="#4A3A30" stroke-width="10"/>
</svg>
